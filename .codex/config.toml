# Project-scoped Codex defaults for NeedThisDone.
# This layer is loaded because the project is trusted in ~/.codex/config.toml.
# Codex reads the canonical AGENTS.md files; CLAUDE.md is a Claude bridge.

approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"

# The local release and backup workflow needs HTTPS access and a protected
# backup destination outside the repository. This does not authorize hosted
# migrations, deployments, provider activation, or destructive operations.
[sandbox_workspace_write]
network_access = true
writable_roots = [
  "/Users/abiezerreyes/Documents/NeedThisDone Backups",
]
